version: "3.8"

networks:
  onvif:
    driver: macvlan
    driver_opts:
      parent: ${NETWORK_INTERFACE:-eth0}   # eth0 on Pi/Linux, en0 on Mac (requires OrbStack)
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

services:
  cam1:
    image: eddwills95/onvif-protect-bridge:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam1
      CAMERA_NAME: Patio
      CAMERA_RTSP_URL: ${CAM1_RTSP_URL}
      MTX_PATHS_CAM1_SOURCE: ${CAM1_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.101
        mac_address: "e6:14:3a:8b:84:df"

  cam2:
