name: Test and publish containers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock ./vendor/blinkpy pytest
      - run: python scripts/check-release.py
      - run: python -m pytest tests/test_bridge.py tests/test_web.py tests/test_camera_settings.py -q
      - run: node --check bridge/static/app.js && node --check bridge/static/settings.js
      - run: npm ci && npx tsc --noEmit
        working-directory: vendor/onvif
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image names
        id: names
        shell: bash
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          load: true
          tags: blink-relay-smoke:local
      - name: Test worker image and H.264 encoder
        run: |
          docker run --rm blink-relay-smoke:local --help
          docker run --rm --entrypoint ffmpeg blink-relay-smoke:local -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=15 -t 1 -c:v libx264 -threads 1 -x264-params sliced-threads=0:slices=1 -f null -
      # Sources publish first. Failure prevents publication of the binary image.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: sources
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.base }}-sources:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.base }}:latest
            ${{ steps.names.outputs.base }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.blink-camera-relay.sources=${{ steps.names.outputs.base }}-sources:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: vendor/onvif
          platforms: linux/amd64
          target: sources
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.base }}-onvif-sources:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: vendor/onvif
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.base }}-onvif:latest
            ${{ steps.names.outputs.base }}-onvif:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
