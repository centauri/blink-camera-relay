name: Test and publish containers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock ./vendor/blinkpy pytest
      - run: python scripts/check-release.py
      - run: python -m pytest tests/test_bridge.py tests/test_web.py tests/test_camera_settings.py tests/test_release.py tests/test_preview.py -q
      - run: node --check bridge/static/app.js && node --check bridge/static/settings.js
      - run: node --test tests/test_metadata.cjs
      - run: npm ci && npm audit --audit-level=high && npx tsc --noEmit
        working-directory: vendor/onvif
  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image names
        id: names
        shell: bash
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=latest
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && git diff-tree --no-commit-id --name-only -r HEAD | grep -qx VERSION; then
            version="v$(tr -d '\r\n' < VERSION)"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
            if [[ -n "$(git ls-remote --tags origin "refs/tags/$version")" ]]; then
              echo 'Version already released; increment VERSION'; exit 1
            fi
            channel=latest
          else
            channel=edge
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          provenance: false
          sbom: false
          load: true
          tags: blink-relay-smoke:local
      - name: Smoke test the integrated container
        run: |
          docker run --rm blink-relay-smoke:local python /app/bridge/app.py --help
          docker run --rm -e BRIDGE_SOURCE_ROOT=/app -v "$PWD/tests/immis_tls_smoke.py:/tmp/immis_tls_smoke.py:ro" blink-relay-smoke:local python /tmp/immis_tls_smoke.py
          docker run --rm blink-relay-smoke:local node --version
          docker run --rm blink-relay-smoke:local mediamtx --version
          docker run --rm blink-relay-smoke:local ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=15 -t 1 -c:v libx264 -threads 1 -x264-params sliced-threads=0:slices=1 -f null -
          docker run -d --name relay-smoke -p 127.0.0.1:8787:8787 -e BRIDGE_ADMIN_PASSWORD=ci-only-test-password blink-relay-smoke:local
          trap 'docker logs relay-smoke; docker rm -f relay-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent -u admin:ci-only-test-password http://127.0.0.1:8787/api/status > /tmp/status.json; then break; fi
            sleep 1
          done
          python -c "import json; s=json.load(open('/tmp/status.json')); assert all(s['runtime'].values())"
          python tests/container_smoke.py
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/status)" = 401
      - name: Export matching dependency sources
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: sources
          outputs: type=local,dest=source-dist
          provenance: false
          sbom: false
      - name: Publish source archive before the image
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd source-dist
          sha256sum corresponding-sources.tar.gz > corresponding-sources.tar.gz.sha256
          tag="sources-${GITHUB_SHA}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Dependency sources ${GITHUB_SHA}" --notes "Matching dependency source archives for container sha-${GITHUB_SHA}. Download only; not a runnable application. Retain alongside the corresponding image."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" corresponding-sources.tar.gz corresponding-sources.tar.gz.sha256 --clobber
      - name: Publish the single Unraid image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.base }}:${{ steps.names.outputs.channel }}
            ${{ steps.names.outputs.base }}:sha-${{ github.sha }}
            ${{ steps.names.outputs.version != '' && format('{0}:{1}', steps.names.outputs.base, steps.names.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.blink-camera-relay.sources=https://github.com/${{ github.repository }}/releases/tag/sources-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Publish versioned release after the image
        if: github.event_name != 'pull_request' && steps.names.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.names.outputs.version }}
        run: |
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Blink Camera Relay $RELEASE_VERSION" --notes-file RELEASE-NOTES.md --latest
