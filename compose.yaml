name: blink-camera-relay
services:
  relay:
    image: ${BRIDGE_IMAGE:-ghcr.io/centauri/blink-camera-relay:latest}
    build:
      context: .
      target: runtime
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      BRIDGE_HOST: ${BRIDGE_HOST:?Set the server LAN IPv4 address}
      BRIDGE_ADMIN_PASSWORD: ${BRIDGE_ADMIN_PASSWORD:?Set a dashboard password of at least 12 characters}
      BLINK_IMMIS_CERT_SHA256: ${BLINK_IMMIS_CERT_SHA256:-}
    volumes:
      - ${APPDATA_PATH:-./data}:/data
    tmpfs:
      - /run/blink:mode=0700
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
